{% extends "base.html" %}

{% block title %}Password updated{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white shadow-sm rounded-2xl p-8 w-full max-w-sm border border-stone-200">
        <h1 class="text-2xl font-semibold text-center mb-1 text-stone-900">Password updated</h1>
        <p class="text-center text-sm text-stone-500 mt-6">
            Your password has been changed. You can now log in with your new password.
        </p>

        <a href="{% url 'login' %}"
           class="mt-6 block w-full text-center bg-teal-600 text-white py-2 rounded-lg font-medium hover:bg-teal-700 transition">
            Log in
        </a>
    </div>
</div>
{% endblock %}
