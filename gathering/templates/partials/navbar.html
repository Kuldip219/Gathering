<nav class="bg-white border-b border-stone-200 sticky top-0 z-10">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="{% url 'home' %}"
           class="text-lg font-semibold text-teal-700 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2">Gathering</a>
        <div class="flex items-center gap-3">
            <a href="{% url 'create_post' %}" class="text-sm bg-teal-600 text-white px-3 py-1.5 rounded-lg hover:bg-teal-700 transition">
                + New post
            </a>

            <div class="relative">
                <button type="button" id="account-menu-button"
                        aria-haspopup="true" aria-expanded="false" aria-controls="account-menu-panel"
                        aria-label="Account menu"
                        class="block w-9 h-9 rounded-full overflow-hidden bg-stone-200 flex items-center justify-center flex-shrink-0 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2">
                    {% if request.user.profile_picture %}
                        <img src="{{ request.user.profile_picture.url }}"
                             alt=""
                             class="w-full h-full object-cover">
                    {% else %}
                        <span class="text-sm font-semibold text-stone-500">
                            {{ request.user.username|first|upper }}
                        </span>
                    {% endif %}
                </button>

                <div id="account-menu-panel"
                     class="hidden absolute right-0 mt-2 w-44 bg-white border border-stone-200 rounded-xl shadow-lg py-1 z-20">
                    <a href="{% url 'profile_redirect' %}"
                       class="block px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 focus:bg-stone-50 focus:outline-none">
                        My profile
                    </a>
                    <a href="{% url 'profile' request.user.username %}"
                       class="block px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 focus:bg-stone-50 focus:outline-none">
                        Edit profile
                    </a>
                    <a href="{% url 'change_email' %}"
                       class="block px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 focus:bg-stone-50 focus:outline-none">
                        Edit email
                    </a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit"
                                class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 focus:bg-red-50 focus:outline-none">
                            Log out
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<script>
    (function () {
        var button = document.getElementById('account-menu-button');
        var panel = document.getElementById('account-menu-panel');
        if (!button || !panel) return;

        function openMenu() {
            panel.classList.remove('hidden');
            button.setAttribute('aria-expanded', 'true');
        }

        function closeMenu() {
            panel.classList.add('hidden');
            button.setAttribute('aria-expanded', 'false');
        }

        button.addEventListener('click', function (event) {
            event.stopPropagation();
            if (panel.classList.contains('hidden')) {
                openMenu();
            } else {
                closeMenu();
            }
        });

        document.addEventListener('click', function (event) {
            if (!panel.contains(event.target) && !button.contains(event.target)) {
                closeMenu();
            }
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && !panel.classList.contains('hidden')) {
                closeMenu();
                button.focus();
            }
        });
    })();
</script>
