{% extends "base.html" %}

{% block title %}Check your email{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white shadow-sm rounded-2xl p-8 w-full max-w-sm border border-stone-200">
        <h1 class="text-2xl font-semibold text-center mb-1 text-stone-900">Check your email</h1>
        <p class="text-center text-sm text-stone-500 mt-6">
            If an account exists for that email, we've sent you a link to reset your password.
            It can take a few minutes to arrive — check your spam folder too.
        </p>

        <p class="text-center text-sm text-stone-500 mt-6">
            <a href="{% url 'login' %}" class="text-teal-600 font-medium hover:underline">Back to log in</a>
        </p>
    </div>
</div>
{% endblock %}
